version: '3.8'

services:
  # FastAPI Backend
  echozero-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echozero-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ECHOZERO_MODE=api
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./models:/app/models  # Persist trained models
      - ./logs:/app/logs      # Persist logs
    restart: unless-stopped
    networks:
      - echozero-network

  # Streamlit Frontend
  echozero-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echozero-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - ECHOZERO_MODE=ui
      - BACKEND_URL=http://echozero-backend:8000
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - echozero-backend
    restart: unless-stopped
    networks:
      - echozero-network

networks:
  echozero-network:
    driver: bridge

volumes:
  models:
  logs:
