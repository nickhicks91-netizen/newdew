model:
  num_nodes: 20
  dim: 128
  ricci: -2.0
  torsion_scale: 0.1
  penrose_level: 2
  num_layers: 5

encoder:
  mode: 'eeg'  # Options: 'text', 'eeg', 'spectral'
  dim: 128

decoder:
  num_classes: 2
  chiral_projection: true

echo_core:
  num_spheres: 8  # Number of harmonic memory nodes (octave gates)
  use_feedback: true  # Enable phase-locking feedback paths
  helix_turns: 4  # Number of helical turns for k=3 torsion coupling
  dropout: 0.1  # Dropout rate for regularization

training:
  batch_size: 16
  learning_rate: 0.001
  num_epochs: 10
  optimizer: 'adam'
  weight_decay: 0.0001

benchmark:
  baseline: 'gat'  # Options: 'gat', 'vanilla_attention'
  dataset: 'emotion'  # HuggingFace dataset
  metrics:
    - 'coherence'
    - 'fidelity'
    - 'hallucination_rate'
  targets:
    speed_multiplier: 1.4
    fidelity: 0.98
    hallucination_drop: 0.05
    # EchoCore-specific targets
    coherence_std_on_noise: 0.065  # Target std on 30% noise (25% better than 0.087 baseline)
    noise_rejection_rate: 0.88  # 88% noise rejection target
    toroidal_stability: 0.85  # Minimum toroidal stability

wandb:
  project: 'echozero'
  entity: null
  log_interval: 10

paths:
  data_dir: './data'
  checkpoint_dir: './checkpoints'
  output_dir: './outputs'
